<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>2026 Deep Run CIT Hackathon | The Panthers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cmsv2-assets.apptegy.net/uploads/16074/logo/17596/image__30_.png" type="image/png" sizes="any">
</head>
<body>
    <!-- Section 1 -->
    <section id="section-1">
        <!-- Top Text Content -->
        <div class="body-container">
            <div class="child-container">
                <!-- CIT Logo -->
                <a href="./index.html" class="logo-parent">
                    <img src="https://cmsv2-assets.apptegy.net/uploads/16074/logo/17596/image__30_.png" alt="CIT Logo" class="cit-logo" height="80" width="80">
                </a>
                <!-- Lang Late Text -->
                <div class="lang-late-text">
                    <img src="https://blog.flamingtext.com/blog/2026/10/19/flamingtext_com_1792446053_528741081.png" border="0" alt="Logo Design by FlamingText.com" title="Logo Design by FlamingText.com">
                </div>
                <div class="header"><br>
                    <div class="heading-1">
                       <h1>2026 Deep Run CIT Hackathon</h1>
                    </div>
                </div>
                <div class="button-1">
                    <button class="translate-button" id="TranslatePage" onclick="goTo('section-2')">Go to Translation Page</button>
                </div>
            </div>
        </div>
    </section>
    <!-- Section 2 -->
    <section id="section-2">
        <!-- Form Container for Language Inputs (Text) -->
        <form class="form-container">
            <label for="name">Original Language</label>
                <button id="AddLang" onclick="AddLang1()">Add Language 1</button>
                <button id="AddLang" onclick="AddLang2()">Add Language 2</button>
                <button id="AddLang" onclick="AddLang3()">Add Language 3</button>
                <button id="AddLang" onclick="AddLang4()">Add Language 4</button>
                <button id="AddLang" onclick="AddLang5()">Add Language 5</button>
                <!-- Dropdown Menu for Language Selections (Dropdown) -->
                <label for="lang">Language</label>
                <select name="name" id="list">
                    <option value="">Name three things ten seconds ago</option>
                </select>
            <label for="lang">Language</label>
            <input type="text" id="LangInput" name="language">
            <button type="submit" onclick="initializeLanguageList()">Submit</button>
        </form>
    </section>
    <!-- Section 3 -->
    <section id="section-3">
        
    </section>
    <!-- JS Link -->
    <script src="script.js"></script>
</body>
</html>
