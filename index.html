<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangLate Dictionary</title>
<style>
body {
max-width: 760px;
margin: 40px auto;
padding: 0 20px;
background: #fff;
color: #222;
font-family: Arial, sans-serif;
line-height: 1.5;
}


h1,
h2 {
color: #111;
}


form,
.language-controls {
display: grid;
gap: 12px;
}


label {
display: block;
margin-bottom: 4px;
font-weight: 600;
}


input,
select,
button {
min-height: 40px;
padding: 8px 10px;
font: inherit;
}


.language-controls {
grid-template-columns: 1fr auto;
align-items: end;
margin: 20px 0;
}


.untranslated-fields {
display: grid;
grid-template-columns: minmax(130px, .7fr) minmax(0, 1.3fr);
gap: 10px;
}


.word-pair {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
padding: 12px 0;
border-bottom: 1px solid #ddd;
}


.word-pair p {
margin: 0;
overflow-wrap: anywhere;
}


.status {
min-height: 1.5em;
}


@media (max-width: 520px) {
body {
margin-top: 24px;
}


.language-controls {
grid-template-columns: 1fr;
}


.untranslated-fields {
grid-template-columns: 1fr;
}


.word-pair {
align-items: flex-start;
}
}
</style>
</head>
<body>
<main>
<h1>LangLate Dictionary</h1>
<p>Add a language, enter an untranslated word and its match, then save the pair.</p>


<section aria-labelledby="language-heading">
<h2 id="language-heading">Add a language</h2>
<div class="language-controls">
<div>
<label for="newLanguage">Language name</label>
<input id="newLanguage" type="text" placeholder="e.g. Spanish" autocomplete="off">
</div>
<button id="addLanguageButton" type="button">Add language</button>
</div>
</section>


<section aria-labelledby="entry-heading">
<h2 id="entry-heading">Add a word pair</h2>
<form id="entryForm">
<div>
<label for="originalWord">Untranslated word</label>
<div class="untranslated-fields">
<select id="originalLanguage" name="originalLanguage" aria-label="Language for untranslated word" required>
<option value="">Choose a language</option>
</select>
<input id="originalWord" name="originalWord" type="text" placeholder="Enter the word" autocomplete="off" required>
</div>
</div>
<div>
<label for="matchedWord">Matched word</label>
<input id="matchedWord" name="matchedWord" type="text" autocomplete="off" required>
</div>
<button type="submit">Save word pair</button>
</form>
<p id="status" class="status" role="status" aria-live="polite"></p>
</section>


<section aria-labelledby="dictionary-heading">
<h2 id="dictionary-heading">Saved pairs</h2>
<ul id="entries" aria-live="polite"></ul>
</section>
</main>
<script src="./script.js"></script>
</body>
</html>
